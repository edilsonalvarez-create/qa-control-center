name: Daily Drive sync

on:
  schedule:
    # 06:05 America/Bogota (UTC-5). Primary scheduler is node-cron on Railway at 06:00.
    - cron: "5 11 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call API cron endpoint
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          curl -sS -X POST "${API_URL}/api/v1/integrations/google/cron" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --fail-with-body
