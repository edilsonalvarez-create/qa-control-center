services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qacc
      POSTGRES_PASSWORD: qacc
      POSTGRES_DB: qa_control_center
    ports:
      - "5432:5432"
    volumes:
      - qacc_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qacc -d qa_control_center"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://qacc:qacc@postgres:5432/qa_control_center?schema=public
      CORS_ORIGINS: http://localhost:5173,http://localhost:3100
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "3100:80"
    depends_on:
      - api

volumes:
  qacc_pg:
